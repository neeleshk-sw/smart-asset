apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: smartasset
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
    spec:
      containers:
        - name: document-service
          image: smartasset/document-service:latest
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: smartasset-common-config
            - secretRef:
                name: smartasset-secrets
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  namespace: smartasset
spec:
  type: ClusterIP
  ports:
    - port: 8086
      targetPort: 8086
  selector:
    app: document-service
