apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: smartasset
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: smartasset/orchestrator:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: smartasset-common-config
            - secretRef:
                name: smartasset-secrets
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: smartasset
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: orchestrator
