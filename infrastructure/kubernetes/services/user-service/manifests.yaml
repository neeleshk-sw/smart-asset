apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: smartasset
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: smartasset/user-service:latest
          ports:
            - containerPort: 8092
          envFrom:
            - configMapRef:
                name: smartasset-common-config
            - secretRef:
                name: smartasset-secrets
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8092
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8092
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: smartasset
spec:
  type: ClusterIP
  ports:
    - port: 8092
      targetPort: 8092
  selector:
    app: user-service
