spring:
  datasource:
    url: jdbc:h2:mem:orchestratordb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS orchestrator_schema
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  kafka:
    enabled: false # Ensure kafka doesn't try to connect during E2E tests

# Disable OTLP and external logs during tests
management:
  tracing:
    enabled: false
  otlp:
    tracing:
      endpoint: http://disabled
logging:
  loki:
    enabled: false
