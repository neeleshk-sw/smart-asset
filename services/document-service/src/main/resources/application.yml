server:
  port: 8086

spring:
  application:
    name: document-service
  config:
    import:
      - classpath:application-common.yml
      - classpath:application-services.yml
  datasource:
    username: ${DATABASE_USER:document_user}
    password: ${DATABASE_PASSWORD:document@123}
  jpa:
    properties:
      hibernate:
        default_schema: document_schema
