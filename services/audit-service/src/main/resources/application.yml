server:
  port: 8090

spring:
  application:
    name: audit-service
  config:
    import:
      - classpath:application-common.yml
      - classpath:application-services.yml
  datasource:
    username: ${DATABASE_USER:audit_user}
    password: ${DATABASE_PASSWORD:audit@123}
  jpa:
    properties:
      hibernate:
        default_schema: audit_schema
