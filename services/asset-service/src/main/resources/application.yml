server:
  port: 8082

spring:
  application:
    name: asset-service
  config:
    import:
      - classpath:application-common.yml
      - classpath:application-services.yml
  datasource:
    username: ${DATABASE_USER:asset_user}
    password: ${DATABASE_PASSWORD:asset@123}
  jpa:
    properties:
      hibernate:
        default_schema: asset_schema
