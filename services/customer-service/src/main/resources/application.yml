server:
  port: 8083

spring:
  application:
    name: customer-service
  config:
    import:
      - classpath:application-common.yml
      - classpath:application-services.yml
  datasource:
    username: ${DATABASE_USER:customer_user}
    password: ${DATABASE_PASSWORD:customer@123}
  jpa:
    properties:
      hibernate:
        default_schema: customer_schema
