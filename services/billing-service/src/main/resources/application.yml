server:
  port: 8089

spring:
  application:
    name: billing-service
  config:
    import:
      - classpath:application-common.yml
      - classpath:application-services.yml
  datasource:
    username: ${DATABASE_USER:billing_user}
    password: ${DATABASE_PASSWORD:billing@123}
  jpa:
    properties:
      hibernate:
        default_schema: billing_schema
