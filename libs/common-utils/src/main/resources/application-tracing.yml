# Include this in each service's application.yml:
# spring.config.import: classpath:application-tracing.yml

management:
  tracing:
    sampling:
      probability: 1.0 # 100% sampling for development
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
