# Service URLs for Feign clients and inter-service communication
services:
  asset:
    url: ${ASSET_SERVICE_URL:http://localhost:8082}
  customer:
    url: ${CUSTOMER_SERVICE_URL:http://localhost:8083}
  contract:
    url: ${CONTRACT_SERVICE_URL:http://localhost:8084}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
  document:
    url: ${DOCUMENT_SERVICE_URL:http://localhost:8086}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
  maintenance:
    url: ${MAINTENANCE_SERVICE_URL:http://localhost:8088}
  billing:
    url: ${BILLING_SERVICE_URL:http://localhost:8089}
  audit:
    url: ${AUDIT_SERVICE_URL:http://localhost:8090}
  search:
    url: ${SEARCH_SERVICE_URL:http://localhost:8091}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8092}

# Security - Keycloak/OAuth2
security:
  oauth2:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/smartasset}
    client-id: ${KEYCLOAK_CLIENT_ID:smartasset-api}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}

# Minio/S3 for document storage
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:user}
  secret-key: ${MINIO_SECRET_KEY:password}
  bucket: ${MINIO_BUCKET:smartasset-documents}

# Elasticsearch
elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}
