global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "smartasset-services"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "asset-service:8082"
          - "customer-service:8083"
          - "contract-service:8084"
          - "payment-service:8085"
          - "document-service:8086"
          - "notification-service:8087"
          - "maintenance-service:8088"
          - "billing-service:8089"
          - "audit-service:8090"
          - "search-service:8091"
          - "gateway:8080"
