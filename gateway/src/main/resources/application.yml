server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        # Orchestrator - Workflow endpoints
        - id: orchestrator-workflows
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/workflows/**
        # Asset Service
        - id: asset-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/assets/**
        # Customer Service
        - id: customer-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/customers/**
        # Contract Service
        - id: contract-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/contracts/**
        # Payment Service
        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/payments/**
        # Document Service
        - id: document-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/documents/**
        # Notification Service
        - id: notification-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/notifications/**
        # Maintenance Service
        - id: maintenance-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/maintenance/**
        # Billing Service
        - id: billing-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/invoices/**
        # Audit Service
        - id: audit-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/audit/**
        # Search Service
        - id: search-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/v1/search/**
        # User Service
        - id: user-service
          uri: http://localhost:8092
          predicates:
            - Path=/api/v1/users/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/smartasset

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
